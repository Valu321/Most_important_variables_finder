name: feature-analysis-app
region: fra

services:
- name: feature-analysis-service
  github:
    # PODMIEŃ NA SWOJE DANE:
    repo: TWOJA_NAZWA_UZYTKOWNIKA/TWOJE_REPOZYTORIUM
    branch: main
    deploy_on_push: true
  
  # Używamy Dockerfile dla stabilności środowiska
  dockerfile_path: Dockerfile
  source_dir: /
  
  # WAŻNE: PyCaret wymaga min. 1GB RAM. Basic-s ($12) to bezpieczne minimum.
  instance_count: 1
  instance_size_slug: basic-s
  
  http_port: 8501
  
  health_check:
    http_path: /_stcore/health
    initial_delay_seconds: 90
    period_seconds: 20
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
    
  envs:
  - key: PORT
    value: "8501"
  # Sekrety dodasz w panelu DO
  - key: OPENAI_API_KEY
    type: secret
  - key: LANGFUSE_PUBLIC_KEY
    type: secret
  - key: LANGFUSE_SECRET_KEY
    type: secret
  - key: LANGFUSE_HOST
    value: "https://cloud.langfuse.com"